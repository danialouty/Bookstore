    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bookstore & Reading Club</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Welcome to Community Bookstore</h1>
        </header>

        <main>
            <section class="welcome-section">
                <h2>Find Your Next Favorite Book</h2>
                <form id="input-form">
                    <label >Enter your name:</label>
                    <input type="text" id="usernamefield" placeholder="Enter your name" required>

                    <label >enter your membership type:</label>
                    <input type="text" id="membershipfield" placeholder="Enter your membership type" required>

                    <label >Enter your favorite genre:</label>
                    <input type="text" id="genrefield" placeholder="Enter your favorite genre" required>

                    <label >Enter your book title:</label>
                    <input type="text" id="titlefield" placeholder="Enter your book title" required>
                    <button type="submit" id ="submitbtn">Submit</button>
                </form>
            </section>
            <div class="result-card">

            </div>

                
        </main>

        <footer>
            <p>&copy; 2026 Community Bookstore. All rights reserved.</p>
        </footer>
        <script src="app.js"></script>
    </body>
    </html>
